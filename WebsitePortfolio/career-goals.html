    <form action="https://wp.zybooks.com/form-viewer.php" method="post"> 
    <fieldset>
    <legend>Contact:</legend>
     <label for="fname">First Name:</label><br>
      <input type="text" id="fname" name="fname"><br>
      <label for="lname">Last Name:</label><br>
      <input type="text" id="lname" name="lname"><br>
      <label for="cname">Company Name:</label><br>
      <input type="text" id="cname" name="cname"><br>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br>
      <label for="tel">Phone Number:</label><br>
      <input type="tel" id="tel" name="tel"><br>
      <label for="message">Message:</label><br>
      <textarea id="message" name="message"> </textarea>
     
      <p>What's the best time to contact you?</p>
    
      <input type="radio" id="am" name="contact_time" value="A.M">
      <label for="am">A.M</label><br>
      <input type="radio" id="pm" name="contact_time" value="P.M">
      <label for="pm">P.M</label><br>
      <input type="radio" id="anytime" name="contact_time" value="Anytime">
      <label for="anytime">Anytime</label><br>
    
    
      <label for="pref_contact">Select your preffered contact method</label><br>
      <select id="pref_contact" name="pref_contact">
        <option value="call">Call</option>
        <option value="text">Text</option>
        <option value="email">Email</option>
      </select>
      <input type="submit">
    </fieldset>
